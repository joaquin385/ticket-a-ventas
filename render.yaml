# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ticket-a-ventas
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: JOBS_API_TOKEN
        generateValue: true
      - key: EXPORT_API_TOKEN
        generateValue: true
      - key: SUBSCRIPTION_PRICE_ARS
        value: "7000"
      - key: LANDING_WHATSAPP_NUMBER
        sync: false
      - key: BASE_URL
        sync: false
